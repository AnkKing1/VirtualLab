services:
  # Backend service with code execution environment (Alpine version)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.alpine
    container_name: virtuallab-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb+srv://Ankit:Mongodb@1@cluster0.7ara8xn.mongodb.net/labDb
      - PORT=5000
      - JWT_SECRET=ankit123
      - JWT_EXPIRE=1d
      - NODE_ENV=production
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock # For Docker-in-Docker if needed
    restart: unless-stopped
    networks:
      - virtuallab-network

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: virtuallab-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - virtuallab-network

networks:
  virtuallab-network:
    driver: bridge

volumes:
  node_modules_backend:
  node_modules_frontend:
